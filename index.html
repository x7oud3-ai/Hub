<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسجل الصوت - TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        .record-btn {
            transition: all 0.3s ease;
        }

        .recording {
            animation: pulse 1.5s infinite;
            background-color: #ef4444 !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .visualizer-bar {
            width: 4px;
            background: #3b82f6;
            margin: 0 2px;
            border-radius: 2px;
            transition: height 0.1s ease;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md w-full glass-morphism p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">مسجل الصوت</h1>
            <p class="text-gray-400 text-sm">Powered by TECH</p>
        </div>

        <!-- Timer -->
        <div class="text-center mb-6">
            <div id="timer" class="text-5xl font-mono font-bold text-white mb-2">00:00</div>
            <div id="status" class="text-blue-400 text-sm animate-pulse hidden">جاري التسجيل...</div>
        </div>

        <!-- Visualizer -->
        <div id="visualizer" class="flex items-end justify-center h-16 mb-8 overflow-hidden">
            <!-- Bars will be added by JS -->
        </div>

        <!-- Controls -->
        <div class="flex flex-col items-center gap-6">
            <button id="recordBtn" class="record-btn w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-500 focus:outline-none">
                <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                <svg id="stopIcon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <rect x="6" y="6" width="12" height="12" stroke-width="2" />
                </svg>
            </button>

            <div id="messageBox" class="text-center text-sm text-red-400 hidden"></div>
        </div>

        <!-- Playlist -->
        <div class="mt-10">
            <h2 class="text-lg font-bold mb-4 border-b border-gray-700 pb-2">التسجيلات المحفوظة</h2>
            <div id="recordingsList" class="space-y-4 max-h-60 overflow-y-auto pr-2">
                <!-- Recorded items will appear here -->
                <p id="emptyMsg" class="text-gray-500 text-center py-4">لا توجد تسجيلات بعد</p>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;
        let audioContext;
        let analyser;
        let dataArray;
        let animationId;

        const recordBtn = document.getElementById('recordBtn');
        const micIcon = document.getElementById('micIcon');
        const stopIcon = document.getElementById('stopIcon');
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const recordingsList = document.getElementById('recordingsList');
        const emptyMsg = document.getElementById('emptyMsg');
        const visualizer = document.getElementById('visualizer');
        const messageBox = document.getElementById('messageBox');

        // Create visualizer bars
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            bar.style.height = '4px';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.visualizer-bar');

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                // Visualizer Setup
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    addRecordingToList(audioUrl);
                    audioChunks = [];
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                updateUI(true);
                startTimer();
                animateVisualizer();
                messageBox.classList.add('hidden');
            } catch (err) {
                console.error("خطأ في الوصول للميكروفون:", err);
                messageBox.innerText = "يرجى السماح بالوصول إلى الميكروفون للمتابعة.";
                messageBox.classList.remove('hidden');
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            updateUI(false);
            stopTimer();
            cancelAnimationFrame(animationId);
            bars.forEach(bar => bar.style.height = '4px');
        }

        function updateUI(isRecording) {
            if (isRecording) {
                recordBtn.classList.add('recording');
                micIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
                statusDisplay.classList.remove('hidden');
            } else {
                recordBtn.classList.remove('recording');
                micIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
                statusDisplay.classList.add('hidden');
            }
        }

        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function animateVisualizer() {
            animationId = requestAnimationFrame(animateVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            bars.forEach((bar, i) => {
                const val = dataArray[i] || 0;
                const height = Math.max(4, (val / 255) * 64);
                bar.style.height = `${height}px`;
            });
        }

        function addRecordingToList(url) {
            emptyMsg.classList.add('hidden');
            
            const recordingItem = document.createElement('div');
            recordingItem.className = 'bg-white/10 p-3 rounded-lg flex flex-col gap-2';
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            recordingItem.innerHTML = `
                <div class="flex justify-between items-center text-xs text-gray-400">
                    <span>تسجيل جديد</span>
                    <span>${timeStr}</span>
                </div>
                <audio controls src="${url}" class="w-full h-8"></audio>
                <div class="flex justify-end">
                    <a href="${url}" download="recording_${Date.now()}.wav" class="text-xs text-blue-400 hover:underline">تحميل الملف</a>
                </div>
            `;
            
            recordingsList.prepend(recordingItem);
        }

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
            } else {
                startRecording();
            }
        });
    </script>
</body>
</html>
