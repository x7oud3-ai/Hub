<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسجل الصوت - TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            padding: 20px 10px;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        .record-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .recording {
            animation: pulse 1.5s infinite;
            background-color: #ef4444 !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .visualizer-bar {
            width: 4px;
            background: #60a5fa;
            margin: 0 2px;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .ad-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Top Ad 728x90 -->
    <div class="ad-container hidden md:flex">
        <script>
            atOptions = {
                'key' : '42ac2f525ff092dad94059b5e021c91e',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/42ac2f525ff092dad94059b5e021c91e/invoke.js"></script>
    </div>

    <!-- Main Content -->
    <div class="max-w-md w-full glass-morphism p-6 shadow-2xl mt-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">مسجل الصوت الذكي</h1>
            <p class="text-gray-500 text-xs mt-1">POWERED BY TECH</p>
        </div>

        <!-- Timer Area -->
        <div class="text-center mb-4">
            <div id="timer" class="text-6xl font-mono font-bold text-white mb-2">00:00</div>
            <div id="status" class="text-blue-400 text-sm hidden">جاري تسجيل صوتك الآن...</div>
        </div>

        <!-- Visualizer Area -->
        <div id="visualizer" class="flex items-end justify-center h-12 mb-6 opacity-60">
            <!-- Visualizer Bars -->
        </div>

        <!-- Control Button -->
        <div class="flex flex-col items-center gap-4">
            <button id="recordBtn" class="record-btn w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-500 focus:outline-none ring-4 ring-blue-900/30">
                <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <svg id="stopIcon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <rect x="6" y="6" width="12" height="12" stroke-width="2" rx="1" />
                </svg>
            </button>
            <p id="messageBox" class="text-sm text-red-400 hidden text-center"></p>
        </div>

        <!-- Recorded List -->
        <div class="mt-8">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3 border-b border-gray-800 pb-2">قائمة التسجيلات</h2>
            <div id="recordingsList" class="space-y-3 max-h-48 overflow-y-auto custom-scrollbar">
                <p id="emptyMsg" class="text-gray-600 text-center py-4 text-sm">لا يوجد لديك أي تسجيلات حالية</p>
            </div>
        </div>
    </div>

    <!-- Bottom Ad 320x50 -->
    <div class="ad-container mt-6">
        <script>
            atOptions = {
                'key' : '7795822a45b283ef7e3cf23823a6f6e2',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/7795822a45b283ef7e3cf23823a6f6e2/invoke.js"></script>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;
        let audioContext;
        let analyser;
        let dataArray;
        let animationId;

        const recordBtn = document.getElementById('recordBtn');
        const micIcon = document.getElementById('micIcon');
        const stopIcon = document.getElementById('stopIcon');
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const recordingsList = document.getElementById('recordingsList');
        const emptyMsg = document.getElementById('emptyMsg');
        const visualizer = document.getElementById('visualizer');
        const messageBox = document.getElementById('messageBox');

        // Create 15 bars for visualizer
        for (let i = 0; i < 15; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            bar.style.height = '4px';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.visualizer-bar');

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 32;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(audioBlob);
                    saveRecording(url);
                    audioChunks = [];
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                toggleUI(true);
                animate();
                messageBox.classList.add('hidden');
            } catch (err) {
                messageBox.innerText = "فشل الوصول للميكروفون. يرجى التأكد من السماح بالأذونات.";
                messageBox.classList.remove('hidden');
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            toggleUI(false);
            cancelAnimationFrame(animationId);
            bars.forEach(b => b.style.height = '4px');
        }

        function toggleUI(isRecording) {
            if(isRecording) {
                recordBtn.classList.add('recording');
                micIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
                statusDisplay.classList.remove('hidden');
                startTimer();
            } else {
                recordBtn.classList.remove('recording');
                micIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
                statusDisplay.classList.add('hidden');
                stopTimer();
            }
        }

        function startTimer() {
            seconds = 0;
            timerDisplay.innerText = "00:00";
            timerInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds/60).toString().padStart(2, '0');
                const s = (seconds%60).toString().padStart(2, '0');
                timerDisplay.innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function animate() {
            animationId = requestAnimationFrame(animate);
            analyser.getByteFrequencyData(dataArray);
            bars.forEach((bar, i) => {
                const val = dataArray[i] || 0;
                bar.style.height = `${Math.max(4, (val/255)*48)}px`;
            });
        }

        function saveRecording(url) {
            emptyMsg.classList.add('hidden');
            const item = document.createElement('div');
            item.className = 'bg-white/5 p-3 rounded-xl border border-white/5';
            item.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-gray-500">تم التسجيل: ${new Date().toLocaleTimeString('ar-EG')}</span>
                    <a href="${url}" download="TECH_Record.wav" class="text-xs text-blue-500 hover:text-blue-300">تحميل</a>
                </div>
                <audio controls src="${url}" class="w-full h-8 opacity-80"></audio>
            `;
            recordingsList.prepend(item);
        }

        recordBtn.addEventListener('click', () => {
            if(mediaRecorder?.state === 'recording') stopRecording();
            else startRecording();
        });
    </script>
</body>
</html>
